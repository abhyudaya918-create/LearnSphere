<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a LearnSphere learner profile.">
  <title>Create account · LearnSphere</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script><script src="js/progress.js" defer></script><script src="js/app.js" defer></script>
  <script type="module" src="js/auth-ui.js"></script>
</head>
<body data-auth-mode="signup">
  <div id="site-header"></div>
  <main class="auth-page-shell">
    <a class="auth-back-link" href="index.html"><span aria-hidden="true">←</span> Back to LearnSphere</a>
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-card-brand"><span class="brand-mark" aria-hidden="true">✦</span><span>LearnSphere</span></div>
      <div class="auth-heading"><p class="eyebrow">START YOUR ADVENTURE</p><h1 id="auth-title">Create your profile</h1><p>Save your progress and celebrate every learning step.</p></div>
      <button class="google-auth-button" id="google-auth" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.88c-.58 2.96-2.26 5.48-4.78 7.18l7.72 5.99c4.5-4.16 7.16-10.29 7.16-17.64Z"/><path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.2a23.93 23.93 0 0 0 0 21.58l7.98-6.2Z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.72-5.99c-2.14 1.44-4.88 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.2C6.51 42.62 14.62 48 24 48Z"/></svg>Sign up with Google</button>
      <div class="auth-divider"><span>or use your email</span></div>
      <form class="auth-form" id="auth-form" novalidate>
        <label for="auth-nickname">Nickname <span class="auth-optional">optional</span></label><input id="auth-nickname" name="nickname" type="text" maxlength="24" autocomplete="nickname" placeholder="What should we call you?">
        <label for="auth-email">Email address</label><input id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="auth-password">Password <span class="auth-hint">at least 6 characters</span></label><div class="auth-password-wrap"><input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="6" required><button type="button" class="password-toggle" data-toggle-password="auth-password" aria-label="Show password">Show</button></div>
        <label for="auth-confirm-password">Confirm password</label><div class="auth-password-wrap"><input id="auth-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required><button type="button" class="password-toggle" data-toggle-password="auth-confirm-password" aria-label="Show password">Show</button></div>
        <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        <button class="button button-primary auth-submit" id="auth-submit" type="submit"><span class="auth-spinner" aria-hidden="true"></span><span class="auth-submit-label">Create account</span><span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">Already have a profile? <a href="login.html" id="auth-switch-link">Log in</a></p>
      <p class="auth-guest-note"><span aria-hidden="true">✧</span> Your learning progress on this device will be kept.</p>
    </section>
  </main>
</body>
</html>
